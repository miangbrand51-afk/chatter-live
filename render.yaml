services:
  - type: web
    name: chatter-live
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/chatter.sqlite
    disk:
      name: chatter-data
      mountPath: /var/data
      sizeGB: 1
